<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ShuttleIQ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="logo">🚌 ShuttleIQ</div>
    <div class="live-pill"><span class="dot"></span>Live</div>
  </div>
</header>

<main class="app">

  <!-- Route selector -->
  <section class="card route-card">
    <label class="field-label">Route</label>
    <div class="route-tabs" id="route-tabs">
      {% for r in routes %}
      <button class="route-tab {% if loop.first %}active{% endif %}" data-route="{{ r }}">{{ r }}</button>
      {% endfor %}
    </div>
  </section>

  <!-- Next buses -->
  <section class="card">
    <label class="field-label">Next departures</label>
    <div class="departures" id="departures">
      <div class="loading">Fetching…</div>
    </div>
  </section>

  <!-- Seat map -->
  <section class="card seatmap-card">
    <div class="seatmap-header">
      <label class="field-label">Seat availability</label>
      <span class="seatmap-route" id="seatmap-route"></span>
    </div>
    <div class="cv-pill">📷 CV density feed — simulated</div>
    <div class="bus-wrap">
      <div class="bus-body" id="bus-body">
        <!-- rendered by JS -->
      </div>
    </div>
    <div class="seat-legend">
      <span class="leg-item"><span class="leg-dot free"></span>Free</span>
      <span class="leg-item"><span class="leg-dot taken"></span>Taken</span>
      <span class="leg-item"><span class="leg-dot standing"></span>Standing</span>
    </div>
  </section>

  <!-- Best bus recommendation -->
  <section class="card rec-card" id="rec-card">
    <div class="rec-icon">✅</div>
    <div class="rec-body">
      <div class="rec-title" id="rec-title">Best option loading…</div>
      <div class="rec-sub" id="rec-sub"></div>
    </div>
  </section>

  <!-- Time picker -->
  <section class="card slim-card">
    <div class="slim-row">
      <div class="field-group">
        <label class="field-label">Hour</label>
        <select id="sel-hour">
          {% for h in range(6, 23) %}
          <option value="{{ h }}" {% if h == 8 %}selected{% endif %}>{{ '%02d:00' % h }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field-group">
        <label class="field-label">Day</label>
        <select id="sel-day">
          <option value="0">Monday</option>
          <option value="1">Tuesday</option>
          <option value="2">Wednesday</option>
          <option value="3">Thursday</option>
          <option value="4">Friday</option>
          <option value="5">Saturday</option>
          <option value="6">Sunday</option>
        </select>
      </div>
      <button class="btn-go" id="btn-go">Update</button>
    </div>
  </section>

  <!-- Model accuracy strip (small, unobtrusive) -->
  <section class="card slim-card">
    <label class="field-label">Model accuracy (RF vs historical baseline)</label>
    <div class="accuracy-strip" id="accuracy-strip">—</div>
  </section>

</main>

<script src="/static/js/app.js"></script>
</body>
</html>
